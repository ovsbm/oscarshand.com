# The site lives in /site; its content lives in /content and is edited through the CMS at /admin.
# Every save in the CMS commits to GitHub, and Netlify runs this build and publishes /site.
[build]
  base = ""
  publish = "site"
  command = "node tools/build.mjs"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://www.oscarshand.com/*"
  to = "https://oscarshand.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ideas/canterbury-rail-atlas"
  to = "/ideas/south-island-atlas/"
  status = 301
  force = true

[[redirects]]
  from = "/ideas/canterbury-rail-atlas/*"
  to = "/ideas/south-island-atlas/"
  status = 301
  force = true

[[redirects]]
  from = "/ideas/aubrica-app"
  to = "/work/aubrica/"
  status = 301
  force = true

[[redirects]]
  from = "/ideas/aubrica-app/*"
  to = "/work/aubrica/"
  status = 301
  force = true

# Old #hash links (e.g. /#project/aubrica) are moved to real paths by the page itself.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/ds/*/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/documents/*"
  to = "/about/"
  status = 301
  force = true
